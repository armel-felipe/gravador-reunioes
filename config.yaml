# Configuração central do gravador de reuniões
whisper:
  model: "medium"         # large-v3 | turbo | medium (trocar se lento)
  device: "auto"           # auto | cpu | cuda | mps
  compute_type: "auto"     # auto | int8 | float16

diarizacao:
  model: "pyannote/speaker-diarization-3.1"
  device: "auto"           # auto | cpu | mps | cuda (auto = mps no Apple Silicon, senão cpu)
  min_speakers: null       # null = automático
  max_speakers: null
  limiar_fusao: 0.5        # similaridade mínima (cosine) para fundir speakers (0.0-1.0)

# Selecione um único perfil em `active`.
# Perfis disponíveis: llama-cpp | ollama-local | ollama-cloud | llm-studio | openrouter.
llm:
  active: "llama-cpp"

  providers:
    llama-cpp:
      # llama.cpp server expõe uma API compatível com OpenAI em /v1.
      type: "openai"
      base_url: "http://100.87.71.48:18080/v1"
      model: "qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved-apex-i-compact"

    ollama-local:
      type: "ollama"
      base_url: "http://localhost:11434"
      model: "qwen3.6:35b-a3b-q4_K_M"

    ollama-cloud:
      type: "openai"
      base_url: "https://ollama.com/v1"
      model: "glm-5.3-flash:cloud"
      api_key_env: "LPR_BZ685_OLLAMA_API_KEY"
      max_tokens: 8192
      reasoning_effort: "low"
      retries: 8

    llm-studio:
      # LM Studio expõe uma API compatível com OpenAI em /v1.
      # O ID precisa ser o mesmo retornado por <base_url>/models.
      type: "openai"
      base_url: "http://100.87.71.48:1234/v1"
      model: "qwen3.8-27b-splash"

    openrouter:
      type: "openai"
      base_url: "https://openrouter.ai/api/v1"
      model: "MiMo-V2.6-Flash"
      api_key_env: "OPENROUTER_API_KEY"
      max_tokens: 8192
      retries: 8

caminhos:
  material_dir: "99_material"   # raiz do material; cada gravação vira 99_material/<evento>/

limpeza:
  dias_retencao_audio: 5
