# Configuração central do gravador de reuniões
whisper:
  model: "large-v3"        # large-v3 | medium (trocar se lento)
  device: "auto"           # auto | cpu | cuda | mps
  compute_type: "auto"     # auto | int8 | float16

diarizacao:
  model: "pyannote/speaker-diarization-3.1"
  device: "auto"           # auto | cpu | mps | cuda (auto = mps no Apple Silicon, senão cpu)
  min_speakers: null       # null = automático
  max_speakers: null

ollama:
  # provider: "local"        # local | cloud
  provider: "cloud"        # local | cloud
  # Modelos locais disponíveis (ollama list) — descomente UM para usar:
  local_model: "gemma4:26b-mlx"
  # local_model: "nemotron-3.5-lightning:30b-a3b"
  # local_model: "qwen3.6:35b-mlx"
  # local_model: "qwen3.8:27b-mlx"
  # local_model: "ornith-1.5:35b"
  cloud_model: "glm-5.3:cloud"
  cloud_base_url: "https://ollama.com"       # base SEM /v1 (ex.: https://ollama.com); o código adiciona /v1/chat/completions
  cloud_api_key_env: "LPR_BZ685_OLLAMA_API_KEY"  # nome da env var com a chave

caminhos:
  material_dir: "99_material"   # raiz do material; cada gravação vira 99_material/<evento>/

limpeza:
  dias_retencao_audio: 30
